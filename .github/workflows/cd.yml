name: CD - Azure Provisioning & Canary Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-resilience-prod
  AZURE_LOCATION: southeastasia
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '22.x'

jobs:
  # ============================================================================
  # Job 1: Apply Infrastructure-as-Code (Bicep)
  # ============================================================================
  deploy-infra:
    name: 🏗️ Deploy Azure IaC (Bicep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Resource Group Exists
        run: |
          az group create --name ${{ env.AZURE_RESOURCE_GROUP }} --location ${{ env.AZURE_LOCATION }}

      - name: Provision Infrastructure via Bicep
        uses: azure/arm-deploy@v1
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: environmentName=prod resourcePrefix=resilience-demo

  # ============================================================================
  # Job 2: Deploy Microservices (Direct to Production — F1 tier, no slots)
  # ============================================================================
  deploy-backend:
    name: 🚀 Deploy Backend Services
    needs: [deploy-infra]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Resolve dynamic app names from the resource prefix + uniqueString
      - name: Resolve App Service Names
        id: resolve-names
        run: |
          ENTITLEMENTS_APP=$(az webapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?contains(name, 'entitlements')].name" -o tsv)
          RECOMMENDATIONS_APP=$(az webapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?contains(name, 'recommendations')].name" -o tsv)
          echo "entitlements_app=$ENTITLEMENTS_APP" >> $GITHUB_OUTPUT
          echo "recommendations_app=$RECOMMENDATIONS_APP" >> $GITHUB_OUTPUT
          echo "Resolved: Entitlements=$ENTITLEMENTS_APP, Recommendations=$RECOMMENDATIONS_APP"

      # 1. Build & Deploy EntitlementsService
      - name: Publish EntitlementsService
        run: |
          dotnet publish src/EntitlementsService/EntitlementsService.csproj -c Release -o ./publish/entitlements

      - name: Deploy EntitlementsService to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.resolve-names.outputs.entitlements_app }}
          package: ./publish/entitlements

      # 2. Build & Deploy RecommendationsService (direct to production — no slots on F1)
      - name: Publish RecommendationsService
        run: |
          dotnet publish src/RecommendationsService/RecommendationsService.csproj -c Release -o ./publish/recommendations

      - name: Deploy RecommendationsService to Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.resolve-names.outputs.recommendations_app }}
          package: ./publish/recommendations

  # ============================================================================
  # Job 3: Deploy Frontend (Client Portal SPA)
  # ============================================================================
  deploy-frontend:
    name: 🌐 Deploy Client Portal SPA
    needs: [deploy-infra]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies & Build Portal
        run: |
          cd src/client-portal
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/src/client-portal"
          output_location: "dist"
